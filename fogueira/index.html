<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fogueira</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section id="auth" class="auth" hidden></section>

    <div id="app" class="app" hidden>
      <nav class="rail" id="rail" aria-label="Servidores"></nav>

      <aside class="channels" id="channels">
        <button class="server-head" id="serverHead" aria-haspopup="menu"></button>
        <div class="menu" id="serverMenu" hidden></div>
        <div class="channel-list" id="channelList"></div>
        <div class="me" id="mePanel"></div>
      </aside>

      <main class="chat">
        <header class="topbar">
          <button class="icon-btn only-mobile" id="navBtn" aria-label="Abrir servidores e canais">☰</button>
          <h1 id="channelTitle"></h1>
          <button class="icon-btn" id="membersBtn" aria-label="Mostrar membros">Membros</button>
        </header>
        <div class="messages" id="messages" role="log" aria-live="polite"></div>
        <form class="composer" id="composer" autocomplete="off">
          <textarea id="input" rows="1" maxlength="2000" placeholder="Escreva uma mensagem" aria-label="Mensagem"></textarea>
          <button type="submit" class="send" id="sendBtn">Enviar</button>
        </form>
      </main>

      <aside class="members" id="members" aria-label="Membros"></aside>
      <div class="backdrop" id="backdrop"></div>
    </div>

    <div id="modal" class="modal" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
